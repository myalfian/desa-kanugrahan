<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Mock-UP==>Desa Kanugrahan — Portal Resmi Desa Digital | Kec. Maduran, Lamongan</title>
    <meta
      name="description"
      content="Portal resmi Desa Kanugrahan, Kec. Maduran, Kab. Lamongan, Jawa Timur. Layanan administrasi mandiri, pengaduan warga, bursa harga tani, portal diaspora, Karang Taruna, dan transparansi APBDes."
    />
    <meta name="theme-color" content="#047857" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="https://kanugrahan.desa.id/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="id_ID" />
    <meta property="og:title" content="Desa Kanugrahan — Kembali ke desa membangun Desa bersama" />
    <meta property="og:description" content="Satu pintu layanan publik digital Desa Kanugrahan, Lamongan." />
    <meta property="og:image" content="/images/hero-1600.webp" />

    <!-- Performa: preconnect font + preload hero LCP -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="image"
      type="image/avif"
      href="/images/hero-960.avif"
      imagesrcset="/images/hero-480.avif 480w, /images/hero-960.avif 960w, /images/hero-1600.avif 1600w"
      imagesizes="100vw"
      fetchpriority="high"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Data terstruktur untuk mesin pencari -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "GovernmentOrganization",
        "name": "Pemerintah Desa Kanugrahan",
        "slogan": "Kembali ke desa membangun Desa bersama",
        "url": "https://kanugrahan.desa.id",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Kanugrahan, Maduran",
          "addressRegion": "Jawa Timur",
          "addressCountry": "ID"
        }
      }
    </script>
  </head>
  <body>
    <noscript>Aktifkan JavaScript untuk menggunakan layanan mandiri Desa Kanugrahan.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
